---
# Reusable link checker for thechelsuk's sites (workflow_call only). Each site
# calls it from a short .github/workflows/link-checker.yml (see README.md),
# which sets the schedule and inputs.
#
# Builds the site (Jekyll) or checks the HTML as it is, runs lychee over it,
# and keeps one open "broken-links" issue assigned to thechelsuk: opened or
# updated when links are broken, closed once a run finds none.
name: Link Checker

on:
  workflow_call:
    inputs:
      site_host:
        description: The site's own host (e.g. thechels.uk); links to it are checked as local files.
        required: true
        type: string
      build:
        description: '"jekyll" builds with bundle exec jekyll build; "none" checks the HTML in site_dir as it is.'
        default: jekyll
        type: string
      site_dir:
        description: Where the built HTML is (_site for Jekyll, "." for a plain HTML site).
        default: _site
        type: string
      ruby_version:
        description: For Jekyll sites. ".ruby-version" reads the repo's own file.
        default: "3.3"
        type: string
      jekyll_args:
        description: Extra arguments for jekyll build (e.g. --config _config.yml,_config.production.yml).
        default: ""
        type: string
      post_build:
        description: A command the site's deploy runs after the build (e.g. bash .github/scripts/copy-markdown-sources.sh), so the check sees what is deployed.
        default: ""
        type: string
      internal_only:
        description: Check internal links and fragments only (for sites with too many outbound links).
        default: false
        type: boolean
      extra_args:
        description: Extra lychee arguments, such as --exclude for hosts that block bots.
        default: ""
        type: string
      assignee:
        default: thechelsuk
        type: string

permissions:
  contents: read
  issues: write

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    env:
      ROOT: ${{ github.workspace }}/${{ inputs.site_dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        if: inputs.build == 'jekyll'
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Build site
        if: inputs.build == 'jekyll'
        run: bundle exec jekyll build ${{ inputs.jekyll_args }}

      - name: After the build, as the deploy does
        if: inputs.post_build != ''
        run: ${{ inputs.post_build }}

      # webmention.io/.../xmlrpc and /webmention are the pages' pingback and
      # webmention endpoints (in <head>), which refuse plain requests: skipped.
      # GitHub Pages serves /page from page.html, then page.xml, even when the
      # name has a dot in it (/homebridge-2.0-launch). lychee only adds .html,
      # and not to a dotted name, so link each file at its extensionless path.
      - name: Serve pages as GitHub Pages does
        run: |
          find "$ROOT" -type f \( -name '*.html' -o -name '*.xml' \) -print0 | sort -z |
            while IFS= read -r -d '' f; do b="${f%.*}"; [ -e "$b" ] || ln "$f" "$b"; done

      - name: Choose what to check
        id: scope
        run: |
          if [ "${{ inputs.internal_only }}" = "true" ]; then
            echo "args=--offline --include-fragments --exclude '^https?://'" >> "$GITHUB_OUTPUT"
          else
            # 403, 405 and 429 count as alive: many sites block or rate-limit bots
            # while working for people. Google Maps answers bots with a consent loop.
            echo "args=--accept 100..=103,200..=299,403,405,429 --exclude 'google\.com/maps' --timeout 20 --max-retries 3" >> "$GITHUB_OUTPUT"
          fi

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir "${{ env.ROOT }}"
            --remap 'https?://${{ inputs.site_host }}(/.*)? file://${{ env.ROOT }}$1'
            --exclude '^mailto:'
            --exclude 'webmention\.io/'
            ${{ steps.scope.outputs.args }}
            ${{ inputs.extra_args }}
            './${{ inputs.site_dir }}/**/*.html'
          # Report, don't fail: a failed step would skip the issue steps below.
          fail: false
          format: markdown
          output: ./lychee/out.md
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # An issue body holds at most 65,536 characters: keep the start of a long
      # report and link to the run, whose summary has all of it.
      - name: Fit the report in an issue
        if: steps.lychee.outputs.exit_code != 0
        run: |
          if [ "$(wc -c < lychee/out.md)" -gt 60000 ]; then
            head -c 58000 lychee/out.md > lychee/short.md
            printf '\n\n…\n\nThe list is cut short here. Every broken link is in [the run'"'"'s summary](%s/%s/actions/runs/%s).\n' \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" >> lychee/short.md
            mv lychee/short.md lychee/out.md
          fi

      - name: Find the open report
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label broken-links --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update the report
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.existing.outputs.number }}
          labels: broken-links
          assignees: ${{ inputs.assignee }}

      - name: Close the report once the links are fixed
        if: steps.lychee.outputs.exit_code == 0 && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close "${{ steps.existing.outputs.number }}" --repo "${{ github.repository }}" --comment "No broken links in run ${{ github.run_id }}."
