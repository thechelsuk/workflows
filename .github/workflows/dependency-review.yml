---
# Reusable dependency review: on a pull request, flags dependencies the PR adds
# or changes that have known vulnerabilities. Each repo calls it from a short
# .github/workflows/dependency-review.yml (see README.md) on pull_request.
name: Dependency Review

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Dependency review
        uses: actions/dependency-review-action@v5
