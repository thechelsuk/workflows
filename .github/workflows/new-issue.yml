name: New Issue

on:
  workflow_call:
    inputs:
      assignee:
        description: Who new issues are assigned to (also never thanked).
        type: string
        default: thechelsuk
      message:
        description: The thank-you comment; {author} becomes the issue author's @handle and {labels} the labels added.
        type: string
        default: >-
          Thanks for opening this, {author}! A GitHub Action has triaged it and tagged it {labels},
          and it's now waiting for a human to review it.
      sponsorable:
        description: The user or organisation whose public sponsors get the sponsor label.
        type: string
        default: thechelsuk
      sponsor_label:
        description: The label added when the issue's author publicly sponsors the sponsorable account.
        type: string
        default: sponsor

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Label, assign and thank
        uses: actions/github-script@v9
        env:
          ASSIGNEE: ${{ inputs.assignee }}
          MESSAGE: ${{ inputs.message }}
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const number = issue.number;
            const assignee = process.env.ASSIGNEE;

            const TYPES = {
              bug: { color: "d73a4a", description: "Something isn't working" },
              enhancement: { color: "a2eeef", description: "New feature or request" },
              question: { color: "d876e3", description: "Further information is requested" },
              feedback: { color: "0e8a16", description: "General feedback" },
              triage: { color: "fbca04", description: "New, not looked at yet" },
              app: { color: "5319e7", description: "About the app" },
              website: { color: "1d76db", description: "About the website" },
            };
            const have = new Set((issue.labels || []).map((l) => l.name));
            const body = issue.body || "";
            const text = `${issue.title}\n${body}`.toLowerCase();
            const want = ["triage"];
            const FORMS = [["### What happened?", "bug"], ["### I would like…", "enhancement"], ["### Your question", "question"], ["### Your feedback", "feedback"]];
            const form = FORMS.find(([heading]) => body.includes(heading));
            if (form) want.push(form[1]);
            else if (have.size === 0) {
              if (/\b(bug|crash(es|ed|ing)?|broken|error|fails?|failing|doesn'?t work|not working|wrong)\b/.test(text)) want.push("bug");
              else if (/\b(could you|would (it|you)|please add|feature|option|support for|ability to|i'?d like|it would be)\b/.test(text)) want.push("enhancement");
              else if (/\?\s*$/.test(issue.title) || /\b(how do i|how does|is there a way|clarify)\b/.test(text)) want.push("question");
            }
            const part = body.match(/### Which part\?\s*\n+\s*(App|Website)\s*$/m);
            if (part) want.push(part[1].toLowerCase());
            const sponsored = /- \[x\] I've sponsored a Feature request bump/i.test(body);
            for (const name of want) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, ...TYPES[name] }); }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: want });

            if (!(issue.assignees || []).some((a) => a.login === assignee)) {
              await github.rest.issues.addAssignees({ owner, repo, issue_number: number, assignees: [assignee] });
            }

            const author = issue.user.login;
            const bot = issue.user.type === "Bot" || author.endsWith("[bot]");
            if (!bot && author.toLowerCase() !== assignee.toLowerCase()) {
              const labels = want.map((l) => `\`${l}\``).join(" and ");
              let comment = process.env.MESSAGE.replaceAll("{author}", `@${author}`).replaceAll("{labels}", labels);
              if (sponsored) comment += "\n\nThanks for sponsoring a Feature request bump. I'll check it and add the `sponsored` label.";
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body: comment });
            }
            core.info(`#${number}: labels ${want.join(", ")}, assigned to ${assignee}${bot ? ", bot author" : ""}`);

      - name: Label sponsors
        uses: actions/github-script@v9
        env:
          SPONSORABLE: ${{ inputs.sponsorable }}
          SPONSOR_LABEL: ${{ inputs.sponsor_label }}
        with:
          script: |
            try {
              const issue = context.payload.issue;
              const { owner, repo } = context.repo;
              const author = issue.user.login;
              const sponsorable = process.env.SPONSORABLE;
              const name = process.env.SPONSOR_LABEL;
              const bot = issue.user.type === "Bot" || author.endsWith("[bot]");
              if (bot || author.toLowerCase() === sponsorable.toLowerCase()) {
                core.info(`${author} skipped for the sponsor label`);
                return;
              }
              const res = await github.graphql(
                `query ($sponsorable: String!, $author: String!) {
                  repositoryOwner(login: $sponsorable) { ... on Sponsorable { isSponsoredBy(accountLogin: $author) } }
                }`,
                { sponsorable, author }
              );
              if (!res.repositoryOwner || !res.repositoryOwner.isSponsoredBy) {
                core.info(`${author} is not a public sponsor of ${sponsorable}`);
                return;
              }
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color: "fedbf0", description: "Sponsors the maintainer" }); }
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [name] });
              core.info(`#${issue.number}: ${author} sponsors ${sponsorable}, labelled ${name}`);
            } catch (error) {
              core.warning(`Sponsor check failed: ${error.message}`);
            }
