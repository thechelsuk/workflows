---
name: Tests

on:
    push:
        branches: [main]
        paths:
            - ".github/actions/**"
            - "tests/**"
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
            - run: pip install pytest
            - run: pytest -q tests
